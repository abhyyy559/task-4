# Fraud Policy v1.0 — official HHGOA TigerGraph task policy (transcribed 2026-09-21
# from the official dataset README, "Fraud Policy" section).
#
# Action names and approval routes below are the EXACT identifiers the answer
# files must use. Rules R1-R10 are quoted verbatim (shortened only where the
# original is prose; the full text lives in TASK-PLAN-APPENDIX-README.md).
#
# Enforcement: src/agent/policy.py (route resolution, approval gating,
# SAR requirement, case-open threshold). src/actions/executor.py executes
# ONLY `auto` actions; L1/L2 actions are recorded as recommendations.

version: 2
source: "HHGOA_IEEE README.md — Fraud Policy v1.0"

# 3a. Open a case whenever fraud probability reaches this threshold,
# whenever evidence is requested, or whenever a customer disputes a charge.
case_open_threshold: 0.30

# 3a. File a SAR when fraud is confirmed or strongly suspected AND at least
# one of: exposure > threshold; shared device profile / shared region cluster /
# another customer's fraud; coordinated or undocumented pattern (R9).
sar:
  exposure_threshold_usd: 1000
  block_card_l1_exposure_limit_usd: 2500

actions:
  ALLOW_TRANSACTION:
    description: "Let the flagged transaction stand"
    customer_impact: none
    route: auto
  DECLINE_TRANSACTION:
    description: "Decline the flagged authorization only. Card stays active"
    customer_impact: low
    route: L1
  MONITOR_CARD:
    description: "Card stays active; raise monitoring sensitivity for 72 hours"
    customer_impact: none
    route: auto
  MONITOR_CONNECTED_CARDS:
    description: "Put other cards linked to the same device profile, region cluster, or ring under monitoring"
    customer_impact: none
    route: auto
  WARN_CUSTOMER:
    description: "Send an informational message (e.g. recurring charge reminder, security tip)"
    customer_impact: none
    route: auto
  VERIFY_WITH_CUSTOMER:
    description: "Ask the cardholder whether they made the transaction. Card stays active pending reply"
    customer_impact: low
    route: auto
  STEP_UP_AUTH:
    description: "Require a one-time passcode or app confirmation before further activity"
    customer_impact: low
    route: auto
  BLOCK_CARD:
    description: "Block this card and reissue"
    customer_impact: high
    route: conditional  # L1 when exposure_usd <= 2500 else L2
  BLOCK_ALL_CARDS:
    description: "Block every card the customer holds"
    customer_impact: very_high
    route: L2
  GENERATE_REPORT:
    description: "Write up the investigation for the internal record, without opening a case"
    customer_impact: none
    route: auto
  CREATE_CASE:
    description: "Open an internal fraud case with the evidence attached, and write it to the graph"
    customer_impact: none
    route: auto
  FILE_REPORT:
    description: "File a suspicious activity report with the regulator"
    customer_impact: none
    route: L2
  ESCALATE_TO_ANALYST:
    description: "Hand the case to a human analyst with the evidence"
    customer_impact: none
    route: auto
  CLOSE_NO_FRAUD:
    description: "Close the alert as legitimate"
    customer_impact: none
    route: auto

routes:
  auto:
    approver: "agent"
    actions: [ALLOW_TRANSACTION, MONITOR_CARD, MONITOR_CONNECTED_CARDS,
              WARN_CUSTOMER, VERIFY_WITH_CUSTOMER, STEP_UP_AUTH,
              GENERATE_REPORT, CREATE_CASE, ESCALATE_TO_ANALYST, CLOSE_NO_FRAUD]
  L1:
    approver: "team_lead"
    actions: [DECLINE_TRANSACTION]
    note: "BLOCK_CARD routes L1 when exposure_usd <= 2500"
  L2:
    approver: "fraud_manager"
    actions: [BLOCK_ALL_CARDS, FILE_REPORT]
    note: "BLOCK_CARD routes L2 when exposure_usd > 2500"

# Rules R1-R10 (verbatim from the official dataset README section 3;
# `when` is a machine-readable trigger the orchestrator evaluates,
# `text` is the citable rule).
rules:
  R1:
    text: "Verify before you block on a weak signal. If the case rests on a single signal (including a risk score alone) and your assessed fraud probability is below 0.70, recommend VERIFY_WITH_CUSTOMER or STEP_UP_AUTH before any block. Blocking a legitimate customer on one signal is a policy breach."
    when: "fraud_probability < 0.70 and evidence_count < 2"
    then: [VERIFY_WITH_CUSTOMER, STEP_UP_AUTH]
  R2:
    text: "Customer denies the transaction. Recommend BLOCK_CARD and CREATE_CASE. Add FILE_REPORT if exposure exceeds $1,000 or the case connects to a shared device profile or another card's fraud."
    when: "customer_response == 'deny'"
    then: [BLOCK_CARD, CREATE_CASE]
  R3:
    text: "Customer confirms the transaction. Recommend CLOSE_NO_FRAUD. Note the confirmation in the case file."
    when: "customer_response == 'confirm'"
    then: [CLOSE_NO_FRAUD]
  R4:
    text: "No reply within 24 hours. Recommend MONITOR_CARD and DECLINE_TRANSACTION for pending authorizations. Escalate if exposure exceeds $500."
    when: "customer_response == 'no_reply'"
    then: [MONITOR_CARD, DECLINE_TRANSACTION]
  R5:
    text: "Card testing. Three or more small online authorizations on one card within an hour, followed by a larger purchase: recommend DECLINE_TRANSACTION and STEP_UP_AUTH. If a purchase over $100 has already cleared, recommend BLOCK_CARD."
    when: "pattern == 'card_testing'"
    then: [DECLINE_TRANSACTION, STEP_UP_AUTH]
  R6:
    text: "Shared origin. When several cards show fraud from the same device profile, the same billing region, or the same recipient email in one window, name the shared element, recommend CREATE_CASE and FILE_REPORT, and MONITOR_CONNECTED_CARDS for every card that shares it."
    when: "shared_origin"
    then: [CREATE_CASE, FILE_REPORT, MONITOR_CONNECTED_CARDS]
  R7:
    text: "Disputed but legitimate. When the customer disputes a charge that matches their own recurring pattern (same merchant, same amount, monthly), recommend CREATE_CASE, VERIFY_WITH_CUSTOMER, and WARN_CUSTOMER. Do not block."
    when: "recurring_pattern_dispute"
    then: [CREATE_CASE, VERIFY_WITH_CUSTOMER, WARN_CUSTOMER]
  R8:
    text: "Escalate when uncertain and exposed. If the verdict is uncertain and exposure exceeds $500, or the evidence conflicts, recommend ESCALATE_TO_ANALYST."
    when: "verdict == 'uncertain' and (exposure_usd > 500 or evidence_conflicts)"
    then: [ESCALATE_TO_ANALYST]
  R9:
    text: "Undocumented patterns. When activity fits none of the known patterns but the evidence shows coordinated or repeated abuse across customers, recommend CREATE_CASE, FILE_REPORT, and ESCALATE_TO_ANALYST, and describe the pattern in your own words. Do not force it into a known category."
    when: "pattern == 'undocumented'"
    then: [CREATE_CASE, FILE_REPORT, ESCALATE_TO_ANALYST]
  R10:
    text: "Never BLOCK_ALL_CARDS unless at least two of the customer's cards show confirmed fraud or the customer's credentials are confirmed compromised."
    when: "block_all_cards_considered"
    then: []

# Stopping criteria (policy section 6).
stopping:
  - "fraud_probability >= 0.85 with at least two independent pieces of evidence"
  - "fraud_probability <= 0.15 with at least two independent pieces of evidence"
  - "a verification response settles the question"
  - "further steps are unlikely to change the decision"

# Exposure (policy section 4): sum of absolute amounts of every transaction
# identified as part of the fraud episode, including the flagged one, in USD.
